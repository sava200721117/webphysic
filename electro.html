<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раздел: Электричество</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f9f9f9;
            --text-main: #000000;
            --text-muted: #666666;
            --border-color: #e5e5e5;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container { width: 100%; max-width: 440px; margin: 0 auto; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 24px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .list-container { display: flex; flex-direction: column; gap: 12px; }
        
        .list-item {
            background: var(--bg-secondary);
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .list-item:active { transform: scale(0.98); }
        .list-item h3 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
        .list-item p { margin: 0; color: var(--text-muted); font-size: 14px; }

        /* КАРТОЧКА */
        .card-container { perspective: 1000px; width: 100%; height: 380px; margin-bottom: 24px; }
        .flashcard {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border: 1px solid var(--border-color); border-radius: 24px; padding: 24px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background: var(--bg-main); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .card-face.back { transform: rotateY(180deg); background: var(--bg-secondary); }

        .card-hint { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); position: absolute; bottom: 20px; }
        .card-question { font-size: 20px; font-weight: 600; }
        .card-formula { font-size: 28px; margin: 0; }

        .controls { display: flex; gap: 12px; }
        .btn {
            flex: 1; background: var(--bg-main); border: 1px solid #000000; border-radius: 16px;
            padding: 16px; font-family: inherit; font-size: 13px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn.black { background: #000000; color: #ffffff; }
        
        .progress-text { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 14px; }

        .results-grid { display: flex; gap: 16px; margin-bottom: 24px; margin-top: 20px; }
        .result-block { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 24px; padding: 24px; text-align: center; }
        .result-value { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 4px; color: #000000; }
        .result-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .xp-earned-text { text-align: center; font-size: 15px; font-weight: 600; margin-bottom: 24px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnWQw-EMU94XXjo02QyvFC6zmGj78Vi8I",
            authDomain: "physics-ege-rating.firebaseapp.com",
            databaseURL: "https://physics-ege-rating-default-rtdb.firebaseio.com",
            projectId: "physics-ege-rating",
            storageBucket: "physics-ege-rating.firebasestorage.app",
            messagingSenderId: "969771916707",
            appId: "1:969771916707:web:867ccfa3d8a7e20ba2ce16",
            measurementId: "G-J7SR7GH8NR"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.fbRef = ref;
        window.fbSet = set;
        window.fbGet = get;
    </script>
</head>
<body>

    <div class="app-container">

        <div id="screen-topics" class="screen active">
            <div class="back-btn" onclick="goBackToMain()">← Главное меню</div>
            <h2 style="font-size: 26px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px;">Электричество</h2>
            <div id="topics-list" class="list-container"></div>
        </div>

        <div id="screen-cards" class="screen">
            <div class="back-btn" onclick="navigateTo('screen-topics')">← К темам электричества</div>
            
            <div class="card-container">
                <div id="flashcard" class="flashcard" onclick="this.classList.toggle('flipped')">
                    <div class="card-face front">
                        <div id="card-front-text" class="card-question">Загрузка...</div>
                        <div class="card-hint">Нажми, чтобы перевернуть</div>
                    </div>
                    <div class="card-face back">
                        <div id="card-back-formula" class="card-formula">$$$$</div>
                        <div class="card-hint">Нажми, чтобы вернуть обратно</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" onclick="handleScore(false)">НЕ ПОМНЮ</button>
                <button class="btn black" onclick="handleScore(true)">ПОМНЮ</button>
            </div>
            <div id="progress" class="progress-text">Карточка 1 из 1</div>
        </div>

        <div id="screen-results" class="screen">
            <h2 style="font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px;">Тема пройдена</h2>
            <p style="text-align: center; color: var(--text-muted); margin: 0 0 20px 0; font-size: 15px;">Ваш результат фиксации формул:</p>
            
            <div class="results-grid">
                <div class="result-block">
                    <div id="res-percent" class="result-value">0%</div>
                    <div class="result-label">Точность</div>
                </div>
                <div class="result-block">
                    <div id="res-count" class="result-value">0 / 0</div>
                    <div class="result-label">Вспомнил</div>
                </div>
            </div>

            <div id="xp-earned" class="xp-earned-text">Загрузка и сохранение опыта...</div>

            <div class="controls">
                <button class="btn" onclick="navigateTo('screen-topics')">К темам</button>
                <button class="btn black" onclick="restartCurrentTopic()">Заново</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        
        // Исправленный массив формул электричества с двойными слэшами
        const electroData = [
    {
        id: "electrostatics",
        title: "Электростатика",
        cards: [
            { q: "Закон Кулона", f: "$$F = k\\frac{|q_1 q_2|}{r^2}$$" },
            { q: "Напряженность поля", f: "$$E = \\frac{F}{q}$$" },
            { q: "Напряженность точечного заряда", f: "$$E = k\\frac{|q|}{r^2}$$" },
            { q: "Потенциал поля точечного заряда", f: "$$\\phi = k\\frac{q}{r}$$" },
            { q: "Потенциальная энергия заряда", f: "$$W_п = q\\phi$$" },
            { q: "Связь E, U и d", f: "$$E = \\frac{U}{d}$$" },
            { q: "Электроемкость (определение)", f: "$$C = \\frac{q}{U}$$" },
            { q: "Емкость плоского конденсатора", f: "$$C = \\frac{\\varepsilon \\varepsilon_0 S}{d}$$" },
            { q: "Энергия конденсатора", f: "$$W = \\frac{CU^2}{2} = \\frac{q^2}{2C}$$" },
            { q: "Последовательное соед. конденсаторов", f: "$$\\frac{1}{C_{общ}} = \\frac{1}{C_1} + \\frac{1}{C_2}$$" },
            { q: "Параллельное соед. конденсаторов", f: "$$C_{общ} = C_1 + C_2$$" }
        ]
    },
    {
        id: "dc_current",
        title: "Постоянный ток",
        cards: [
            { q: "Сила тока", f: "$$I = \\frac{\\Delta q}{\\Delta t}$$" },
            { q: "Закон Ома для участка цепи", f: "$$I = \\frac{U}{R}$$" },
            { q: "Сопротивление через параметры", f: "$$R = \\rho \\frac{l}{S}$$" },
            { q: "Последовательное соед. резисторов", f: "$$R_{общ} = R_1 + R_2$$" },
            { q: "Параллельное соед. резисторов", f: "$$\\frac{1}{R_{общ}} = \\frac{1}{R_1} + \\frac{1}{R_2}$$" },
            { q: "Закон Ома для полной цепи", f: "$$I = \\frac{\\mathcal{E}}{R + r}$$" },
            { q: "Закон Джоуля-Ленца (теплота)", f: "$$Q = I^2 R t$$" },
            { q: "Мощность тока", f: "$$P = UI = I^2 R = \\frac{U^2}{R}$$" },
            { q: "ЭДС", f: "$$\\mathcal{E} = \\frac{A_{ст}}{q}$$" },
            { q: "Короткое замыкание", f: "$$I_{кз} = \\frac{\\mathcal{E}}{r}$$" }
        ]
    }
];

        let currentCards = [];
        let currentCardIndex = 0;
        let correctAnswersCount = 0;
        let rawActiveCardsClone = [];

        function goBackToMain() {
            window.location.href = "index.html";
        }

        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function initTopicsList() {
            const list = document.getElementById('topics-list');
            list.innerHTML = '';
            electroData.forEach(topic => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => {
                    rawActiveCardsClone = topic.cards;
                    startCards(topic.cards);
                };
                item.innerHTML = `<h3>${topic.title}</h3><p>Формул для повторения: ${topic.cards.length}</p>`;
                list.appendChild(item);
            });
        }

        function startCards(cardsArray) {
            currentCards = shuffleArray(cardsArray);
            currentCardIndex = 0;
            correctAnswersCount = 0;
            renderCard();
            navigateTo('screen-cards');
        }

        function restartCurrentTopic() {
            startCards(rawActiveCardsClone);
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderCard() {
            document.getElementById('flashcard').classList.remove('flipped');
            const cardData = currentCards[currentCardIndex];
            document.getElementById('card-front-text').innerText = cardData.q;
            document.getElementById('card-back-formula').innerText = cardData.f;
            document.getElementById('progress').innerText = `Карточка ${currentCardIndex + 1} из ${currentCards.length}`;

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function handleScore(remembered) {
            if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (remembered) {
                correctAnswersCount++;
                let viewed = parseInt(localStorage.getItem('global_cards_viewed')) || 0;
                localStorage.setItem('global_cards_viewed', viewed + 1);
            }

            if (currentCardIndex < currentCards.length - 1) {
                currentCardIndex++;
                renderCard();
            } else {
                showResults();
            }
        }

        // АНТИЧИТ: Скачиваем актуальный баланс из базы данных перед сохранением
        function showResults() {
            const percent = Math.round((correctAnswersCount / currentCards.length) * 100);
            const xpGained = correctAnswersCount * 10;
            
            document.getElementById('res-percent').innerText = `${percent}%`;
            document.getElementById('res-count').innerText = `${correctAnswersCount} / ${currentCards.length}`;
            document.getElementById('xp-earned').innerText = `Синхронизация с сервером...`;
            
            navigateTo('screen-results');

            let myId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "local_user_id";
            let myName = localStorage.getItem('user_custom_name') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Пользователь");

            if (window.db && window.fbGet && window.fbRef && window.fbSet) {
                const userRef = window.fbRef(window.db, 'users/' + myId);
                
                // Читаем ОФИЦИАЛЬНОЕ количество очков из Firebase
                window.fbGet(userRef).then((snapshot) => {
                    let cloudXp = 180; // дефолт, если юзера почему-то нет в базе
                    let currentData = null;
                    if (snapshot.exists()) {
                        currentData = snapshot.val();
                        if (currentData.xp !== undefined) cloudXp = parseInt(currentData.xp);
                    }

                    // Прибавляем очки к серверному числу, а не к локальному кэшу телефона!
                    let finalXP = cloudXp + xpGained;
                    
                    // Перезаписываем и локальную память, и сервер синхронно
                    localStorage.setItem('global_physics_xp', finalXP);
                    
                    window.fbSet(userRef, {
                        id: myId,
                        name: currentData && currentData.name ? currentData.name : myName,
                        xp: finalXP
                    }).then(() => {
                        document.getElementById('xp-earned').innerText = `+${xpGained} XP ДОБАВЛЕНО В ПРОФИЛЬ`;
                    });

                }).catch((error) => {
                    console.error(error);
                    fallbackLocalSave(xpGained);
                });
            } else {
                fallbackLocalSave(xpGained);
            }
        }

        function fallbackLocalSave(xpGained) {
            let totalXP = parseInt(localStorage.getItem('global_physics_xp')) || 180;
            localStorage.setItem('global_physics_xp', totalXP + xpGained);
            document.getElementById('xp-earned').innerText = `+${xpGained} XP НАЧИСЛЕНО ЛОКАЛЬНО`;
        }

        initTopicsList();
        
        document.addEventListener("DOMContentLoaded", () => {
            if (tg) {
                tg.ready();
                tg.expand();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оптика</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { padding: 40px; border: 1px solid #eee; border-radius: 20px; text-align: center; width: 80%; max-width: 400px; }
        #card-back-formula { font-size: 24px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="card-front-text">Загрузка карточки...</div>
        <div id="card-back-formula"></div>
        <p style="color: #8e8e93; font-size: 12px; margin-top: 30px;">НАЖМИ, ЧТОБЫ ВЕРНУТЬ ОБРАТНО</p>
    </div>

    <script>
        // ДАННЫЕ ВНУТРИ ТЕГА SCRIPT
        const opticsData = [ 
            { q: "Закон отражения света", f: "$$\\alpha = \\gamma$$" }, 
            { q: "Закон преломления света", f: "$$n_1 \\sin\\alpha = n_2 \\sin\\beta$$" }, 
            { q: "Формула тонкой линзы", f: "$$\\frac{1}{F} = \\frac{1}{d} + \\frac{1}{f}$$" }, 
            { q: "Оптическая сила линзы", f: "$$D = \\frac{1}{F}$$" }, 
            { q: "Линейное увеличение линзы", f: "$$\\Gamma = \\frac{f}{d}$$" } 
        ];

        let index = 0;
        
        function showCard() {
            document.getElementById('card-front-text').innerText = opticsData[index].q;
            document.getElementById('card-back-formula').innerText = opticsData[index].f;
            
            // Принудительный рендер MathJax
            MathJax.typesetClear();
            MathJax.typesetPromise();
        }

        // Запуск при загрузке
        showCard();
    </script>
</body>
</html>
